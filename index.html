<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>can i hit?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --blush: #ffe3ee;
    --petal: #ffb6d0;
    --bubblegum: #ff7eb3;
    --rose: #e8438a;
    --berry: #7a1650;
    --plum: #3d0b2c;
    --cream: #fff8fb;
    --script: 'Pacifico', 'Brush Script MT', cursive;
    --round: 'Fredoka', 'Nunito', ui-rounded, system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: var(--round);
    color: var(--berry);
    background: var(--blush);
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- backgrounds ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; transition: opacity 1.2s ease; }
  .bg-sweet {
    background:
      radial-gradient(60vmax 60vmax at 15% 10%, #ffd3e4 0%, transparent 60%),
      radial-gradient(55vmax 55vmax at 90% 85%, #ffa9cc 0%, transparent 60%),
      radial-gradient(40vmax 40vmax at 80% 5%, #ffe9c9 0%, transparent 60%),
      linear-gradient(160deg, #ffe3ee 0%, #ffc4dc 100%);
  }
  .bg-night {
    opacity: 0;
    background:
      radial-gradient(70vmax 50vmax at 50% 110%, #ff6fa6 0%, transparent 65%),
      radial-gradient(50vmax 50vmax at 15% 0%, #8c1d5e 0%, transparent 60%),
      linear-gradient(180deg, #2a0620 0%, #5c0f43 55%, #a3205f 100%);
  }
  body.celebrating .bg-night { opacity: 1; }

  .hearts { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .heart {
    position: absolute; bottom: -10vh; line-height: 1; opacity: 0;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 4px 6px rgba(232, 67, 138, .25));
  }
  @keyframes floatUp {
    0%   { transform: translate3d(0, 0, 0) rotate(-12deg) scale(.8); opacity: 0; }
    10%  { opacity: .9; }
    50%  { transform: translate3d(var(--sway), -55vh, 0) rotate(12deg) scale(1); }
    90%  { opacity: .8; }
    100% { transform: translate3d(calc(var(--sway) * -1), -115vh, 0) rotate(-10deg) scale(1.1); opacity: 0; }
  }

  /* ---------- question scene ---------- */
  .scene {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; gap: 28px;
  }
  .ask h1 {
    margin: 0; font-family: var(--script); font-weight: 400;
    font-size: clamp(3.4rem, 16vw, 8rem); line-height: 1.05;
    color: var(--rose);
    text-shadow: 0 3px 0 #fff, 0 8px 0 rgba(255, 126, 179, .35), 0 18px 30px rgba(232, 67, 138, .25);
    letter-spacing: .01em;
  }
  .ask .sub {
    margin: 10px 0 0; font-size: clamp(1rem, 3.6vw, 1.25rem); font-weight: 400;
    color: var(--berry); opacity: .8; min-height: 1.6em;
    transition: opacity .2s;
  }
  .buttons { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; min-height: 76px; }
  .btn {
    font-family: var(--round); font-weight: 600; border: 0; cursor: pointer;
    border-radius: 999px; padding: 16px 40px; font-size: 1.35rem; color: #fff;
    touch-action: manipulation; user-select: none;
  }
  .btn:focus-visible { outline: 4px solid var(--berry); outline-offset: 4px; }
  .yes {
    background: linear-gradient(180deg, #ff8fbd, var(--rose));
    box-shadow: 0 6px 0 #b82b69, 0 14px 24px rgba(232, 67, 138, .4);
    transition: transform .15s ease, box-shadow .15s ease;
    transform: scale(var(--yes-scale, 1));
  }
  .yes:hover { transform: scale(calc(var(--yes-scale, 1) * 1.06)); }
  .yes:active { transform: translateY(4px) scale(var(--yes-scale, 1)); box-shadow: 0 2px 0 #b82b69, 0 8px 14px rgba(232, 67, 138, .4); }
  .no {
    background: #fff; color: var(--berry);
    box-shadow: 0 6px 0 #ffc2d9, 0 14px 24px rgba(232, 67, 138, .18);
    transition: left .28s cubic-bezier(.34, 1.56, .64, 1), top .28s cubic-bezier(.34, 1.56, .64, 1);
    z-index: 5;
  }
  .no.runaway { position: fixed; }
  .no-slot { display: inline-block; }

  /* ---------- celebration ---------- */
  .party {
    position: fixed; inset: 0; z-index: 3; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 24px; text-align: center; pointer-events: none;
  }
  body.celebrating .party { display: flex; }
  body.celebrating .scene, body.celebrating .hearts { display: none; }
  .party .cat {
    width: min(58vw, 300px); height: auto; transform-origin: 50% 100%;
    animation: dance .5s ease-in-out infinite alternate;
    filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .35)) drop-shadow(0 0 22px rgba(255, 182, 208, .6));
    image-rendering: auto;
  }
  @keyframes dance {
    0%   { transform: translateY(0) rotate(-7deg) scale(1, .96); }
    100% { transform: translateY(-26px) rotate(7deg) scale(1, 1.04); }
  }
  .yip {
    margin: 0; font-family: var(--script); font-weight: 400;
    font-size: clamp(2.6rem, 13vw, 6rem); color: #fff; line-height: 1.15;
    text-shadow: 0 3px 0 var(--rose), 0 8px 0 #b82b69, 0 0 30px rgba(255, 126, 179, .9);
  }
  .yip span { display: inline-block; animation: wave 1.1s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms); }
  @keyframes wave { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.12); } }
  .party .tag { margin: 6px 0 0; color: #ffd6e6; font-size: clamp(1rem, 3.6vw, 1.3rem); }
  .controls { position: fixed; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: none; justify-content: center; gap: 12px; }
  body.celebrating .controls { display: flex; }
  .pill {
    font-family: var(--round); font-weight: 600; font-size: 1rem; cursor: pointer;
    border: 2px solid rgba(255, 255, 255, .7); color: #fff; background: rgba(255, 255, 255, .14);
    padding: 10px 22px; border-radius: 999px; backdrop-filter: blur(6px);
  }
  .pill:hover { background: rgba(255, 255, 255, .28); }
  .pill:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  canvas#fx { position: fixed; inset: 0; z-index: 4; pointer-events: none; width: 100%; height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    .heart { animation-duration: 40s !important; }
    .party .cat { animation-duration: 1.2s; }
    .yip span { animation: none; }
    .no { transition: none; }
  }
</style>
</head>

<script>
(function () {
  var body = document.body;
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var noSlot = document.getElementById('noSlot');
  var sub = document.getElementById('sub');

  /* ---------- floating hearts ---------- */
  var heartsEl = document.getElementById('hearts');
  var glyphs = ['💗', '💖', '💕', '🌸', '💘', '🩷'];
  for (var i = 0; i < 20; i++) {
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = glyphs[i % glyphs.length];
    h.style.left = (Math.random() * 100) + 'vw';
    h.style.fontSize = (16 + Math.random() * 28) + 'px';
    h.style.animationDuration = (10 + Math.random() * 12) + 's';
    h.style.animationDelay = (-Math.random() * 20) + 's';
    h.style.setProperty('--sway', (Math.random() * 60 - 30) + 'px');
    heartsEl.appendChild(h);
  }

  /* ---------- the runaway "no" ---------- */
  var taunts = [
    'pretty please 🥺',
    'nuh-uh, try again 😼',
    'too slow! 💨',
    'that button is shy 🙈',
    'the yes button is right there 👉',
    'you can\'t catch it 🏃',
    'okay now you\'re just playing 😭',
    'please? 🥹💗'
  ];
  var dodges = 0;
  var lastX = -1, lastY = -1;

  function dodge(e) {
    if (e && e.preventDefault) e.preventDefault();
    var rect = no.getBoundingClientRect();

      noSlot.style.width = rect.width + 'px';
      noSlot.style.height = rect.height + 'px';

    var pad = 14;
    var maxX = vw - rect.width - pad, maxY = vh - rect.height - pad - 8;

    do {
      nx = pad + Math.random() * (maxX - pad);
      ny = pad + Math.random() * (maxY - pad);
      tries++;
    } while (tries < 30 && Math.hypot(nx - lastX, ny - lastY) < Math.min(vw, vh) * 0.35);

    var yr = yes.getBoundingClientRect();
    if (nx < yr.right + 20 && nx + rect.width > yr.left - 20 && ny < yr.bottom + 20 && ny + rect.height > yr.top - 20) {
      ny = (yr.top > vh / 2) ? pad + 10 : maxY - 10;
    }
    lastX = nx; lastY = ny;
    no.style.left = nx + 'px';
    no.style.top = ny + 'px';

    dodges++;
    sub.textContent = taunts[Math.min(dodges, taunts.length - 1)];
    yes.style.setProperty('--yes-scale', Math.min(1 + dodges * 0.06, 1.5).toFixed(2));
  }
  no.addEventListener('pointerenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('touchstart', dodge, { passive: false });
  no.addEventListener('click', dodge);
  no.addEventListener('focus', dodge);

  /* ---------- "yippieeeee" letters ---------- */
  var yip = document.getElementById('yip');
  'yippieeeee'.split('').forEach(function (ch, i) {
    var s = document.createElement('span');
    s.textContent = ch;
    s.style.setProperty('--i', i);
    yip.appendChild(s);
  });

  /* ---------- music (original synth jingle, no external audio) ---------- */
  var ctx = null, master = null, timer = null, step = 0, nextT = 0, muted = false, noiseBuf = null;
  var STEP = 0.185;
  var melody = [
    76,79,76,72,76,79,84,79,
    74,79,83,79,74,79,83,86,
    72,76,81,76,72,76,81,84,
    72,77,81,77,81,84,81,77
  ];
  var roots = [48, 43, 45, 41];
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function tone(type, freq, t, dur, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function kick(t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.7, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.2);
  }
  function noise(t, dur, vol, hp) {
    var src = ctx.createBufferSource(); src.buffer = noiseBuf;
    var f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }
  function playStep(s, t) {
    var bar = Math.floor(s / 8) % 4, pos = s % 8;
    tone('triangle', mtof(melody[s]), t, STEP * 0.95, 0.32);
    tone('square', mtof(melody[s]), t, STEP * 0.5, 0.045);
    if (pos % 2 === 0) tone('triangle', mtof(roots[bar] + (pos % 4 === 0 ? 0 : 12)), t, STEP * 1.6, 0.34);
    if (pos % 4 === 0) kick(t);
    if (pos === 2 || pos === 6) noise(t, 0.12, 0.28, 1500);
    noise(t, 0.03, 0.07, 7000);
    if (s % 32 === 0) tone('sine', mtof(96), t, 0.5, 0.05);
  }
  function startMusic() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.55;
      master.connect(ctx.destination);
      var len = ctx.sampleRate * 0.3;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      step = 0; nextT = ctx.currentTime + 0.05;
      timer = setInterval(function () {
        while (nextT < ctx.currentTime + 0.2) {
          playStep(step % 32, nextT);
          nextT += STEP; step++;
        }
      }, 25);
    } catch (err) { /* audio unavailable: the party still works */ }
  }
  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
  }

  /* ---------- fireworks + confetti ---------- */
  var cv = document.getElementById('fx');
  var g2 = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  var palette = ['#ff7eb3', '#ffd1e3', '#fff1a8', '#ffffff', '#ff4f9a', '#ffb347', '#c9a7ff'];
  var rockets = [], sparks = [], bits = [];
  var running = false, raf = 0, lastLaunch = 0;

  function launch(x) {
    rockets.push({
      x: x != null ? x : W * (0.15 + Math.random() * 0.7),
      y: H + 10,
      vy: -(H * 0.011 + Math.random() * H * 0.004),
      peak: H * (0.12 + Math.random() * 0.35),
      color: palette[(Math.random() * palette.length) | 0]
    });
  }
  function burst(x, y, color) {
    var n = 70 + (Math.random() * 40 | 0);
    var shape = Math.random();
    for (var i = 0; i < n; i++) {
      var a, sp;
      if (shape < 0.28) { // heart-shaped burst
        var t = (i / n) * Math.PI * 2;
        var hx = 16 * Math.pow(Math.sin(t), 3);
        var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        sparks.push({ x: x, y: y, vx: hx * 0.34, vy: hy * 0.34, life: 1, decay: 0.011 + Math.random() * 0.005, color: color, r: 2.4, heart: false });
        continue;
      }
      a = Math.random() * Math.PI * 2;
      sp = (shape < 0.6 ? 1 + Math.random() * 5 : 4.2 + Math.random() * 0.8);
      sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.009 + Math.random() * 0.01, color: Math.random() < 0.25 ? '#fff' : color, r: 1.8 + Math.random() * 1.4 });
    }
  }
  function confetti(n) {
    for (var i = 0; i < n; i++) {
      bits.push({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.5,
        vx: (Math.random() - 0.5) * 1.6, vy: 1.4 + Math.random() * 2.4,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.2,
        s: 7 + Math.random() * 8, color: palette[(Math.random() * palette.length) | 0],
        heart: Math.random() < 0.5
      });
    }
  }
  function drawHeart(x, y, s, rot, color) {
    g2.save(); g2.translate(x, y); g2.rotate(rot); g2.fillStyle = color;
    g2.beginPath();
    g2.moveTo(0, s * 0.35);
    g2.bezierCurveTo(-s, -s * 0.2, -s * 0.5, -s * 0.9, 0, -s * 0.35);
    g2.bezierCurveTo(s * 0.5, -s * 0.9, s, -s * 0.2, 0, s * 0.35);
    g2.fill(); g2.restore();
  }
  function frame(ts) {
    if (!running) return;
    // fade previous frame for trails
    g2.globalCompositeOperation = 'destination-out';
    g2.fillStyle = 'rgba(0,0,0,0.22)';
    g2.fillRect(0, 0, W, H);
    g2.globalCompositeOperation = 'lighter';

    if (ts - lastLaunch > 520) { launch(); if (Math.random() < 0.4) launch(); lastLaunch = ts; }

    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.y += r.vy; r.vy *= 0.985;
      g2.fillStyle = '#fff'; g2.beginPath(); g2.arc(r.x, r.y, 2.2, 0, 6.3); g2.fill();
      if (r.y <= r.peak || Math.abs(r.vy) < 1.2) { burst(r.x, r.y, r.color); rockets.splice(i, 1); }
    }
    for (var j = sparks.length - 1; j >= 0; j--) {
      var p = sparks[j];
      p.x += p.vx; p.y += p.vy; p.vy += 0.055; p.vx *= 0.985; p.vy *= 0.985; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(j, 1); continue; }
      g2.globalAlpha = Math.max(p.life, 0);
      g2.fillStyle = p.color;
      g2.beginPath(); g2.arc(p.x, p.y, p.r * (0.5 + p.life * 0.5), 0, 6.3); g2.fill();
    }
    g2.globalAlpha = 1;
    g2.globalCompositeOperation = 'source-over';
    for (var k = bits.length - 1; k >= 0; k--) {
      var b = bits[k];
      b.x += b.vx + Math.sin(b.y * 0.02) * 0.6; b.y += b.vy; b.rot += b.vr;
      if (b.y > H + 30) { b.y = -20; b.x = Math.random() * W; }
      if (b.heart) drawHeart(b.x, b.y, b.s * 0.9, b.rot * 0.3, b.color);
      else { g2.save(); g2.translate(b.x, b.y); g2.rotate(b.rot); g2.fillStyle = b.color; g2.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); g2.restore(); }
    }
    raf = requestAnimationFrame(frame);
  }
  function startFx() {
    running = true; rockets = []; sparks = []; bits = [];
    g2.clearRect(0, 0, W, H);
    lastLaunch = 0;
    for (var i = 0; i < 4; i++) setTimeout(function () { if (running) launch(); }, i * 160);
    confetti(70);
    raf = requestAnimationFrame(frame);
  }
  function stopFx() { running = false; cancelAnimationFrame(raf); g2.clearRect(0, 0, W, H); }

  // tap anywhere on the party for extra fireworks
  document.addEventListener('pointerdown', function (e) {
    if (!body.classList.contains('celebrating')) return;
    if (e.target.closest && e.target.closest('.controls')) return;
    var r = { x: e.clientX, y: H + 10, vy: -(H * 0.012), peak: e.clientY, color: palette[(Math.random() * palette.length) | 0] };
    rockets.push(r);
  });

  /* ---------- wiring ---------- */
  yes.addEventListener('click', function () {
    body.classList.add('celebrating');
    startMusic();
    startFx();
  });
  document.getElementById('again').addEventListener('click', function () {
    body.classList.remove('celebrating');
    stopMusic(); stopFx();
    dodges = 0; lastX = lastY = -1;
    sub.textContent = taunts[0];
    yes.style.setProperty('--yes-scale', 1);
    no.classList.remove('runaway');
    no.style.left = ''; no.style.top = '';
    noSlot.style.width = ''; noSlot.style.height = '';
  });
  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.55;
    muteBtn.textContent = muted ? 'unmute 🔊' : 'mute 🔇';
  });
})();
</script>
</body>
</html>
